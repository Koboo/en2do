plugins {
    id('java-library')
    id('com.gradleup.shadow') version('9.6.1')
    id('com.vanniktech.maven.publish') version('0.37.0')
}

group('eu.koboo')
version('3.3.3')

repositories {
    mavenCentral()
}

dependencies {
    // The mongodb driver itself
    api(libs.mongoDriver)
    testImplementation(libs.mongoDriver)

    // Eliminate boilerplate code
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    testImplementation(libs.lombok)
    testAnnotationProcessor(libs.lombok)

    // Test-Suite runtime
    testImplementation(platform(libs.jupiterBom))
    testImplementation(libs.jupiterApi)
    testRuntimeOnly(libs.jupiterEngine)
    testImplementation(libs.jupiterLauncher)

    // SLF4j logger for test-suite
    testImplementation(libs.slf4jJdk)
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.fork = true
    options.encoding = 'UTF-8'
}

tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allJava
    archiveClassifier.set('sources')
}
tasks.register('javadocJar', Jar) {
    from javadoc.destinationDir
    archiveClassifier.set('javadoc')
}

artifacts {
    archives(shadowJar)
    archives(sourcesJar)
    archives(javadocJar)
}

mavenPublishing {
    coordinates(project.group.toString(), "${project.name}", project.version.toString())

    pom {
        name = 'En2do'
        description = 'MongoDB entity to document wrapper'
        inceptionYear = '2022'
        url = 'https://github.com/Koboo/en2do'
        licenses {
            license {
                name = 'MIT'
                url = 'https://mit-license.org/'
                distribution = 'https://mit-license.org/'
            }
        }
        developers {
            developer {
                id = 'koboo'
                name = 'Koboo'
                email = 'admin@koboo.eu'
                url = 'https://github.com/Koboo/'
            }
        }
        scm {
            url = 'https://github.com/Koboo/en2do'
            connection = 'scm:git:https://github.com/Koboo/en2do'
            developerConnection = 'scm:git:https://github.com/Koboo/en2do'
        }
    }
    publishToMavenCentral()
    signAllPublications()
}